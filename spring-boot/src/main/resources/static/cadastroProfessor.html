<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humora | Cadastro de professor</title>
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/fect.css">
  <link rel="stylesheet" href="css/campo-senha.css">
  <script src="js/api.js" defer></script>
  <script src="js/formularios.js" defer></script>
  <script src="js/cadastroProfessor.js" defer></script>
  <script src="js/amoras.js" defer></script>
</head>
<body class="fect-entrada">
  <main class="fect-formulario fect-formulario-unico">
    <a class="fect-link" href="professor.html">← Voltar ao painel</a>
    <h1>Cadastro de professor</h1>
    <p id="feedbackProfessor" role="status">Verificando acesso…</p>
    <form id="formProfessor" hidden>
      <label for="nome">Nome</label>
      <input id="nome" name="nome" autocomplete="off" required>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="off" required>
      <label for="senha">Senha inicial</label>
      <div class="campo-senha">
        <input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required>
        <button type="button" class="campo-senha__alternar" aria-label="Mostrar senha" aria-controls="senha" aria-pressed="false" hidden>
          <span class="campo-senha__icone" aria-hidden="true"></span>
        </button>
      </div>
      <label for="area">Disciplina</label>
      <select id="area" name="materia" required>
        <option value="">Selecione</option>
        <option value="PORTUGUES">Português</option>
        <option value="INGLES">Inglês</option>
        <option value="ESPANHOL">Espanhol</option>
        <option value="ARTE">Arte</option>
        <option value="EDUCACAO_FISICA">Educação física</option>
        <option value="EDUCACAO_DIGITAL">Educação digital</option>
        <option value="MATEMATICA">Matemática</option>
        <option value="FISICA">Física</option>
        <option value="QUIMICA">Química</option>
        <option value="BIOLOGIA">Biologia</option>
        <option value="HISTORIA">História</option>
        <option value="GEOGRAFIA">Geografia</option>
        <option value="FILOSOFIA">Filosofia</option>
        <option value="SOCIOLOGIA">Sociologia</option>
        <option value="INFORMATICA">Informática</option>
        <option value="ANALISES_CLINICAS">Análises clínicas</option>
        <option value="AGROECOLOGIA">Agroecologia</option>
      </select>
      <button class="fect-acao" type="submit">Cadastrar professor</button>
    </form>
  </main>
</body>
</html>
