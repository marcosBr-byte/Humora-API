
<!doctype html>
<html class="estilo-documento-login" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humora | Cadastro de Aluno</title>

  <link rel="stylesheet" href="css/cadastroAluno.css" />
  <link rel="stylesheet" href="css/campo-senha.css">
</head>

<body class="estilo-fundo-cadastro-aluno">
<div data-emojis-flutuantes aria-hidden="true"
  class="estilo-emojis-flutuantes">
  <div data-emoji-fileira="0" class="estilo-emoji-fileira-0-2"></div>
  <div data-emoji-fileira="1" class="estilo-emoji-fileira-1"></div>
  <div data-emoji-fileira="2" class="estilo-emoji-fileira-2-2"></div>
</div>

<div class="container estilo-container">
  <section class="apresentacao estilo-apresentacao">
    <div class="logo estilo-logo">
      <h1 class="estilo-logo-titulo"><img class="estilo-logo-imagem" src="imagens/logo-humora.png" width="540" height="540" alt="Humora" /></h1>
    </div>

    <h2 class="estilo-apresentacao-subtitulo">
      Comece sua jornada<br />
      de autocuidado.
    </h2>

    <div class="texto estilo-texto">
      <div class="icone estilo-icone"><span class="ui-icon ui-icon--heart estilo-ui-icon--heart" aria-hidden="true"></span></div>
      <p class="estilo-texto-texto">
        Cadastre-se para registrar suas emoções e contribuir para uma escola
        mais acolhedora e preparada para compreender seus estudantes.
      </p>
    </div>

    <img src="imagens/cerebro.png" class="cerebro estilo-cerebro" alt="Humora" />
  </section>

  <section class="login-card estilo-login-card">
    <h1 class="estilo-login-card-titulo"><span class="ui-icon ui-icon--school estilo-ui-icon--school" aria-hidden="true"></span> Cadastro Aluno</h1>

    <p class="estilo-login-card-texto">Preencha seus dados.</p>

    <input class="estilo-nome" type="text" id="nome" placeholder="Nome completo" aria-label="Nome completo" autocomplete="name" required />

    <input class="estilo-email" type="email" id="email" placeholder="E-mail" aria-label="E-mail" autocomplete="email" required />

    <div class="campo-senha">
      <input class="estilo-senha"
              type="password"
              id="senha"
              placeholder="Senha (mínimo 8 caracteres)"
              minlength="8" aria-label="Senha" autocomplete="new-password" required />
      <button type="button" class="campo-senha__alternar" aria-label="Mostrar senha" aria-controls="senha" aria-pressed="false" hidden>
        <span class="campo-senha__icone" aria-hidden="true"></span>
      </button>
    </div>

    <select class="estilo-sala" id="sala" aria-label="Turma" required>
      <option class="estilo-sala-opcao" value="">Selecione sua turma</option>
      <option class="estilo-sala-opcao" value="1º AGROECOLOGIA - A">1º AGROECOLOGIA - A</option>
      <option class="estilo-sala-opcao" value="1º ANÁLISES CLÍNICAS - B">
        1º ANÁLISES CLÍNICAS - B
      </option>
      <option class="estilo-sala-opcao" value="1º ANÁLISES CLÍNICAS - C">
        1º ANÁLISES CLÍNICAS - C
      </option>
      <option class="estilo-sala-opcao" value="1º INFORMÁTICA - D">1º INFORMÁTICA - D</option>
      <option class="estilo-sala-opcao" value="1º INFORMÁTICA - E">1º INFORMÁTICA - E</option>

      <option class="estilo-sala-opcao" value="2º AGROECOLOGIA - F">2º AGROECOLOGIA - F</option>
      <option class="estilo-sala-opcao" value="2º ANÁLISES CLÍNICAS - G">
        2º ANÁLISES CLÍNICAS - G
      </option>
      <option class="estilo-sala-opcao" value="2º INFORMÁTICA - H">2º INFORMÁTICA - H</option>
      <option class="estilo-sala-opcao" value="2º INFORMÁTICA - I">2º INFORMÁTICA - I</option>
      <option class="estilo-sala-opcao" value="2º INFORMÁTICA - J">2º INFORMÁTICA - J</option>

      <option class="estilo-sala-opcao" value="3º AGROECOLOGIA - K">3º AGROECOLOGIA - K</option>
      <option class="estilo-sala-opcao" value="3º ANÁLISES CLÍNICAS - L">
        3º ANÁLISES CLÍNICAS - L
      </option>
      <option class="estilo-sala-opcao" value="3º ANÁLISES CLÍNICAS - M">
        3º ANÁLISES CLÍNICAS - M
      </option>
      <option class="estilo-sala-opcao" value="3º INFORMÁTICA - N">3º INFORMÁTICA - N</option>
      <option class="estilo-sala-opcao" value="3º INFORMÁTICA - O">3º INFORMÁTICA - O</option>
      <option class="estilo-sala-opcao" value="3º INFORMÁTICA - P">3º INFORMÁTICA - P</option>
    </select>

    <button class="estilo-login-card-acao" onclick="cadastrarAluno()">Cadastrar</button>
    <p id="feedbackFormulario" hidden aria-live="polite" aria-atomic="true"
  class="estilo-feedback-formulario"></p>

    <div class="cadastro estilo-cadastro">
      <a class="estilo-cadastro-link" href="login.html"> ← Voltar para Login </a>
    </div>
  </section>
</div>

<script src="js/api.js"></script>
<template id="modeloIndicadorFormulario">
  <span aria-hidden="true" class="estilo-modelo-indicador-formulario-detalhe"></span>
</template>
<script src="js/formularios.js"></script>
<script src="js/cadastroAluno.js"></script>
<template id="modeloFileiraEmojis">
  <div class="estilo-esteira-emocoes">
    <div class="estilo-grupo-emojis" data-grupo-emojis>
      <template data-modelo-emocao>
        <span class="estilo-celula-emocao">
          <span data-medalhao class="estilo-medalhao"></span>
        </span>
      </template>
    </div>
  </div>
</template>
<script src="js/imagens-emocoes.js"></script>
<script src="js/emojis.js"></script>
</body>
</html>
