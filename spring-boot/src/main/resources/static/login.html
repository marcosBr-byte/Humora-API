<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ff">
  <title>Humora | Login</title>
  <link rel="stylesheet" href="css/fect.css">
  <script src="js/api.js" defer></script>
  <script src="js/formularios.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="fect-entrada">
  <main class="fect-acesso">
    <section class="fect-boas-vindas" aria-labelledby="tituloVisitante">
      <a class="fect-marca" href="index.html"><img src="imagens/cerebro.png" alt=""> Humora</a>
      <p class="fect-etiqueta">FECT</p>
      <h1 id="tituloVisitante">Visite o Humora</h1>
      <p>Use seu primeiro nome e sua cidade para participar do termômetro da feira.</p>
      <a href="cadastroVisitante.html" class="fect-acao fect-acao-visitante">Entrar como visitante <span aria-hidden="true">→</span></a>
      <div class="fect-amoras" aria-hidden="true">
        <img src="imagens/emocoes/feliz.webp" alt="">
        <img src="imagens/emocoes/calmo.webp" alt="">
        <img src="imagens/emocoes/triste.webp" alt="">
      </div>
    </section>
    <section class="fect-formulario login-card fect-login-card">
      <h2>Entrar com uma conta</h2>
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" minlength="8" autocomplete="current-password" required>
      <div class="fect-perfis" role="group" aria-label="Tipo de conta">
        <button type="button" id="btnAluno" aria-pressed="false">Aluno</button>
        <button type="button" id="btnProfessor" aria-pressed="true">Professor</button>
      </div>
      <input type="hidden" id="tipoUsuario" value="professor">
      <button class="fect-acao" type="button" onclick="login()">Entrar <span aria-hidden="true">→</span></button>
      <p id="feedbackFormulario" role="status" hidden></p>
    </section>
  </main>
  <template id="modeloIndicadorFormulario"><span class="fect-carregando" aria-hidden="true"></span></template>
</body>
</html>
