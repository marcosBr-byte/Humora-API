<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humora | Admin FECT</title>
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/fect.css">
  <script src="js/api.js" defer></script>
  <script src="js/imagens-emocoes.js" defer></script>
  <script src="js/fect.js" defer></script>
  <script src="js/professor.js" defer></script>
</head>
<body data-humora-painel class="fect-admin-pagina">
  <main class="fect-admin-conteudo" hidden>
    <header class="fect-admin-topo">
      <a class="fect-marca" href="index.html"><img src="imagens/logo-humora.png" width="540" height="540" alt="Humora"></a>
      <button id="sairAdmin" class="fect-botao-secundario" type="button">Sair</button>
    </header>
    <h1 class="fect-admin-titulo">Admin FECT</h1>
    <section id="painelFect" class="fect-painel" aria-labelledby="tituloFectProfessor">
      <div class="fect-cabecalho">
        <span class="fect-icone ui-icon ui-icon--chart" aria-hidden="true"></span>
        <div>
          <h2 id="tituloFectProfessor">Termômetro da feira</h2>
          <p class="fect-atualizacao">Carregando registros…</p>
        </div>
      </div>
      <div class="fect-resumo-feira">
        <div class="fect-total"><strong id="fectTotal">—</strong> <span id="fectLegendaTotal">registros</span></div>
        <div class="fect-total"><strong id="fectMedia">—</strong> <span>intensidade média de 5</span></div>
      </div>
      <div id="fectDistribuicao" class="fect-termometros-feira" aria-label="Percentuais por emoção"></div>
    </section>
  </main>
</body>
</html>
